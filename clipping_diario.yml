# ============================================================
# ⚙️ GitHub Actions — Clipping automático a las 6am CDMX
# ============================================================
# Ubicación en tu repo: .github/workflows/clipping_diario.yml
#
# CDMX está en UTC−6 todo el año (sin horario de verano desde 2022).
# GitHub Actions usa UTC, así que 06:00 CDMX = 12:00 UTC.
# Los cron de GitHub pueden retrasarse varios minutos.
# ============================================================

name: 📱 Clipping Solaris Diario

on:
  schedule:
    - cron: '0 12 * * 1-5'   # Lunes a viernes, 06:00 CDMX

  workflow_dispatch:
    inputs:
      motivo:
        description: '¿Por qué lo ejecutas manualmente?'
        required: false
        default: 'Test manual'

jobs:
  generar-clipping:
    name: Generar clipping del día
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 🤖 Ejecutar pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: python clipping.py
